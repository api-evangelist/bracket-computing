name: Bracket Computing
description: Bracket Computing was a cloud computing and enterprise security company founded in 2011 by
  Tom Gillis and Jason Lango (both formerly of IronPort Systems) and based in Mountain View, California.
  It built a cloud workload-isolation platform that extended encryption, integrity protection, and
  micro-segmentation across heterogeneous public and private cloud environments. The company raised
  roughly $130 million from investors including Andreessen Horowitz (a16z), Fidelity, Goldman Sachs, and
  Sutter Hill Ventures before VMware acquired its intellectual property and key engineers on May 1, 2018,
  folding the technology into the VMware NSX networking and security portfolio. Bracket Computing no
  longer operates as an independent entity and publishes no developer portal, documentation, or public
  API; its primary domain now resolves to a parked domain-for-sale page.
